    <h1 class="hero-title">רשימת הנזכרים ליום הכיפורים תשפ"ז</h1>

    <p id="export-error" class="state-line is-danger no-print" role="alert" hidden></p>
    <p class="state-line no-print">

    <section class="export-section">
