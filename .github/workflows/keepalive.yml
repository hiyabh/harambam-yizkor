# Pings the Supabase REST API weekly so the free project never pauses for inactivity.
# The publishable key is public by design (row-level security limits it to read/insert).
name: Supabase keepalive

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query one row
        run: |
          curl --fail --silent --show-error \
            "https://idgwbzckafwblfuaztcb.supabase.co/rest/v1/yizkor_names?select=id&limit=1" \
            -H "apikey: sb_publishable_J-f2p8YKmzAUISVUhpW3UA_Zhz1RsaQ"
